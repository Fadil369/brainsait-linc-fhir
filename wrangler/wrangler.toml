name = "brainsait-linc-fhir-unified"
main = "src/index.js"
compatibility_date = "2026-05-25"
compatibility_flags = ["nodejs_compat"]

account_id = "d7b99530559ab4f2545e9bdc72a7ab9b"
workers_dev = true

routes = [
  { pattern = "brainsait.io/api/*", zone_id = "auto" }
]

[triggers]
crons = ["*/10 * * * *"]

[observability]
enabled = true

[env.production]
name = "brainsait-linc-fhir-prod"
routes = [
  { pattern = "brainsait.io/api/*", zone_id = "auto" }
]

[env.staging]
name = "brainsait-linc-fhir-staging"

[durable_objects]
bindings = [
  { name = "FHIR_CACHE", class_name = "FHIRCache" }
]

[[kv_namespaces]]
binding = "BRAINSAIT_KV"
id = ""
preview_id = ""

[[r2_buckets]]
binding = "BRAINSAIT_R2"
bucket_name = "brainsait-audit-logs"
